name: Quality gates

on:
  pull_request:
    branches: [main, codex/catalog-filter-consistency, codex/autonomous-design-finish, codex/classic-storefront]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mysql-schema-repair:
    name: MySQL schema repair regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: easytire_schema_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: application
    env:
      APP_ENV: testing
      APP_KEY: base64:MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: easytire_schema_test
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
    steps:
      - name: Checkout full repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up PHP with MySQL
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, fileinfo, mbstring, pdo_mysql
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Prepare retained application compatibility fixture
        working-directory: .
        run: |
          mkdir -p "$RUNNER_TEMP/easytire-old-application"
          git archive f70f358f06af384364973951eaab8d4fac2b2203 application | tar -x -C "$RUNNER_TEMP/easytire-old-application"
          cp -a "$GITHUB_WORKSPACE/application/vendor" "$RUNNER_TEMP/easytire-old-application/application/vendor"
          echo "SCHEMA_REPAIR_OLD_APP_PATH=$RUNNER_TEMP/easytire-old-application/application" >> "$GITHUB_ENV"

      - name: Run real MySQL migration recovery regression
        run: php tests/Integration/mysql-schema-repair-regression.php

      - name: Run service-request intake regression on real MySQL
        run: php tests/Integration/mysql-service-request-intake-regression.php

      - name: Run service-request reschedule concurrency regression on real MySQL
        run: php tests/Integration/mysql-service-request-reschedule-regression.php

  quality:
    name: Application quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: application
    steps:
      - name: Checkout full repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, fileinfo, mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: application/package-lock.json

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare hermetic application environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Validate project-control contract
        working-directory: .
        run: php scripts/validate-project-control.php

      - name: Verify deploy storage isolation
        working-directory: .
        run: bash deploy/tests/post-receive-storage-isolation.sh

      - name: Verify snapshot deployment safety
        working-directory: .
        run: bash deploy/tests/staging-catalog-snapshot-safety.sh

      - name: Verify filter deployment safety
        working-directory: .
        run: bash deploy/tests/staging-catalog-filters-safety.sh

      - name: Verify design finishing deployment safety
        working-directory: .
        run: bash deploy/tests/design-finish-safety.sh

      - name: Verify isolated Classic preview deployment safety
        working-directory: .
        run: bash deploy/tests/classic-preview-safety.sh

      - name: Verify shared customer dual-site deployment safety
        working-directory: .
        run: bash deploy/tests/customer-shared-safety.sh

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Build frontend
        run: npm run build

      - name: Run Laravel regression
        run: php artisan test --compact

      - name: Install Playwright Chromium
        id: playwright_install
        run: npx playwright install --with-deps chromium

      - name: Run buyer and admin E2E
        run: npm run test:e2e

      - name: Run Issue 19 catalog safety E2E
        if: ${{ !cancelled() && steps.playwright_install.outcome == 'success' }}
        run: npm run test:e2e:issue19

      - name: Run snapshot catalog safety E2E
        if: ${{ !cancelled() && steps.playwright_install.outcome == 'success' }}
        run: npx playwright test --config=playwright.snapshot.config.ts

      - name: Run catalog filter consistency E2E
        if: ${{ !cancelled() && steps.playwright_install.outcome == 'success' }}
        run: npx playwright test --config=playwright.filters.config.ts

      - name: Run design finishing journey regression
        if: ${{ !cancelled() && steps.playwright_install.outcome == 'success' }}
        run: npx playwright test --config=playwright.design-finish.config.ts

      - name: Run both design profiles against isolated fixtures
        if: ${{ !cancelled() && steps.playwright_install.outcome == 'success' }}
        run: CLASSIC_PREVIEW_CI_AUTOSTART=1 npx playwright test --config=playwright.classic.config.ts

      - name: Verify shared catalogue quantities using isolated purchasable fixtures
        if: ${{ !cancelled() && steps.playwright_install.outcome == 'success' }}
        run: CLASSIC_PREVIEW_CI_AUTOSTART=1 CUSTOMER_SHARED_LIVE_FIXTURE=1 npx playwright test --config=playwright.classic.config.ts customer-shared-followups --grep "ordinary catalogue quantity"

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            application/playwright-report
            application/test-results
            application/tmp/issue-19/playwright-results
            application/tmp/snapshot/playwright-results
            application/tmp/filters/playwright-results
            application/tmp/design-finish-tests
            application/tmp/classic-preview/report
            application/tmp/classic-preview/test-results
            application/tmp/classic-preview/evidence
            application/tmp/customer-shared/evidence
          if-no-files-found: ignore
          retention-days: 7

  secrets:
    name: Reachable history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
