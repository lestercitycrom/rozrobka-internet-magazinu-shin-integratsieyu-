# Separate Classic preview. Do not replace the primary site's virtual host.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging-classic-easytire.bethub.fun;

    root /var/www/staging-classic-easytire.bethub.fun/current/application/public;
    index index.php;
    server_tokens off;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; frame-src https://www.google.com https://maps.google.com https://www.google.no https://maps.google.no; object-src 'none'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; upgrade-insecure-requests" always;

    access_log /var/log/nginx/staging-classic-easytire.access.log;
    error_log /var/log/nginx/staging-classic-easytire.error.log warn;

    # One canonical CRM / administrative process for the shared database.
    location = /admin {
        return 302 https://staging-easytire.bethub.fun$request_uri;
    }
    location ^~ /admin/ {
        return 302 https://staging-easytire.bethub.fun$request_uri;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\. {
        deny all;
    }

    ssl_certificate /etc/letsencrypt/live/staging-classic-easytire.bethub.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-classic-easytire.bethub.fun/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name staging-classic-easytire.bethub.fun;
    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/staging-classic-easytire.bethub.fun/shared/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://staging-classic-easytire.bethub.fun$request_uri;
    }
}
