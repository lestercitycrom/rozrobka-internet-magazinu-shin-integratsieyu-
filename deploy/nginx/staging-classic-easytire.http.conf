# Bootstrap only: obtain a separate certificate without changing the primary host.
server {
    listen 80;
    listen [::]:80;
    server_name staging-classic-easytire.bethub.fun;
    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/staging-classic-easytire.bethub.fun/shared/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
